<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>じてんしゃ旅</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-screen="title">
  <header class="topbar">
    <h1>じてんしゃ旅</h1>
    <span class="money">所持金 <b id="money">¥0</b></span>
  </header>

  <main class="layout">
    <section class="stage">
      <canvas id="scene" width="320" height="180" aria-label="自転車の組み立て画面"></canvas>
      <canvas id="ride" width="480" height="270" aria-label="走行画面"></canvas>
      <div id="overlay" class="overlay" hidden></div>
      <div id="toast" class="toast" role="status"></div>

      <div class="title-overlay">
        <p class="lead">自転車を組んで、服を選んで、<br />日本の道へ。</p>
        <button id="start" class="big">はじめる</button>
      </div>
    </section>

    <section class="panel edit-panel">
      <h2 class="screen-title">
        <span class="when-assemble">組み立て</span><span class="when-outfit">服をえらぶ</span>
      </h2>
      <p class="tip when-assemble">自転車の部分をタップするか、タブを選んでパーツを付け替えよう。</p>
      <div id="tabs" class="tabs"></div>
      <ul id="items" class="items"></ul>
      <div class="row">
        <button id="remove" class="sub">外す</button>
        <span id="weight" class="weight"></span>
      </div>
      <div id="stats" class="stats"></div>
      <p id="hint" class="hint"></p>
      <div class="row nav">
        <button id="back" class="sub" hidden>◀ もどる</button>
        <button id="next" class="big">服をえらぶ ▶</button>
      </div>
      <button id="reset" class="link">セーブを消して最初から</button>
    </section>

    <section class="panel route-panel">
      <h2 class="screen-title">ルートをえらぶ</h2>
      <p class="tip">走りたいルートを選んでください。</p>
      <ul id="routes" class="routes"></ul>
      <p id="trip-count" class="tip"></p>
      <button id="route-back" class="sub">◀ もどる</button>
    </section>

    <section class="panel ride-panel">
      <div class="ride-head"><b id="r-place"></b><span id="r-clock"></span></div>
      <div class="progress"><div id="r-bar"></div><div id="r-ticks"></div></div>
      <div class="ride-ends"><span id="r-from"></span><span id="r-km"></span><span id="r-to"></span></div>
      <div class="ride-stats">
        <div><span class="label">速さ</span><b id="r-speed"></b><em id="r-slope"></em></div>
        <div><span class="label">体力</span><span class="bar"><span id="r-stamina"></span></span><b id="r-stamina-val"></b></div>
        <div><span class="label">所持金</span><b id="r-money"></b><b id="r-likes" class="likes-mini"></b></div>
      </div>
      <div id="r-modes" class="modes"></div>
      <div class="ride-actions">
        <button id="r-photo" class="big" hidden></button>
        <button id="r-shop" class="big alt" hidden></button>
      </div>
      <ul id="r-log" class="log"></ul>
      <button id="r-quit" class="link">今日はここで終わりにする</button>
    </section>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
